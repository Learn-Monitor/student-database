name: Admin redesign A2 CI

on:
  push:
    branches: ["feature/admin-redesign-coursegroups"]
  pull_request:
    branches: ["arcanum-2026"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/test/js/package-lock.json
      - name: JavaScript suite
        working-directory: src/test/js
        run: npm ci && npm test
      - name: Core tests and fat JAR
        run: ./gradlew clean test shadowJar --rerun-tasks --no-daemon
      - name: Report complete JUnit XML inventory
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          totals = {key: 0 for key in ("tests", "failures", "errors", "skipped")}
          for task in ("test", "curriculumTest"):
              task_totals = dict.fromkeys(totals, 0)
              for path in glob.glob(f"build/test-results/{task}/TEST-*.xml"):
                  root = ET.parse(path).getroot()
                  for key in task_totals:
                      task_totals[key] += int(root.get(key, "0"))
              print(f"JUnit {task}: " + ", ".join(f"{key}={value}" for key, value in task_totals.items()))
              for key in totals:
                  totals[key] += task_totals[key]
          print("JUnit TOTAL: " + ", ".join(f"{key}={value}" for key, value in totals.items()))
          if not totals["tests"]:
              raise SystemExit("No JUnit XML test cases were found")
          PY
      - name: Validate route JSON and patch formatting
        run: |
          python3 -m json.tool src/main/resources/meta/paths/post_paths.json >/dev/null
          git diff --check origin/arcanum-2026...HEAD
      - name: Prepare deployment artifact provenance
        id: provenance
        shell: bash
        run: |
          artifact="$(find build/libs -maxdepth 1 -type f -name 'student-database-*-fat.jar' | head -n 1)"
          test -n "$artifact"
          sha="$(sha256sum "$artifact" | awk '{print $1}')"
          printf 'repository=%s\nbranch=%s\ncommit=%s\nfile=%s\nsha256=%s\nrun_id=%s\ntests=java-and-javascript-passed\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$(basename "$artifact")" "$sha" "$GITHUB_RUN_ID" > build/provenance.txt
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Core fat JAR SHA-256: $sha"
      - uses: actions/upload-artifact@v7
        with:
          name: student-database-admin-a2-${{ github.sha }}
          path: |
            ${{ steps.provenance.outputs.artifact }}
            build/provenance.txt
            build/test-results/test/TEST-*.xml
            build/test-results/curriculumTest/TEST-*.xml
          if-no-files-found: error
