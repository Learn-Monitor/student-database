%[site;title=Lehrerverwaltung;content=!FOLLOWS]
<section id="dashboard">
    <header>
        <h1>Lehrerverwaltung - <span id="teacher-name"></span></h1>
    </header>
    <main>
        <section id="edit-teacher">
            <h2>Lehrer bearbeiten</h2>
            <form method="post" action="/edit-teacher-profile" onsubmit="return confirm('Änderungen an dieser Lehrkraft speichern?')">
                <input type="hidden" name="id" class="teacherId">
                <label>Vorname <input name="firstName" id="teacherFirstName" required></label>
                <label>Nachname <input name="lastName" id="teacherLastName" required></label>
                <label>Loginname <input type="text" name="email" id="teacherEmail" required></label>
                <label>Neues Passwort <input type="password" name="password" id="teacherPassword"></label>
                <button type="submit">Stammdaten speichern</button>
            </form>
            <p>Fächer- und Klassen-Zuordnungen werden im Bereich <a href="/dashboard#halbjahre">Halbjahre einrichten</a> verwaltet.</p>
        </section>
        %[teacher_infos]
    </main>
    <nav>
        %[admin_teacher_nav]
    </nav>
</section>
<script src="build_teacher.js"></script>
