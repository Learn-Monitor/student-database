%[site;title=Fächer verwalten;content=!FOLLOWS]
<section id="subjects">
    <header>
        <h1>Fächer verwalten</h1>
    </header>
    <main>
        <section id="manage-subjects">
            <form id="manage-subjects-form" method="post" action="/add-subject">
                <label for="subject-name">Fachname:</label>
                <input type="text" id="subject-name" name="name" required>
                <button type="submit">Fach hinzufügen</button>
            </form>
        </section>
        <section id="subject-list">
            <h2>Vorhandene Fächer</h2>
            <p>Fachart vorab festlegen: verbindliche Fächer gelten für alle; WPF und Religion/Ethik werden pro Schüler und Gruppe individuell zugeordnet.</p>
            <div id="subjectTypes"></div>
            <ul id="subjectList">
                <!-- Dynamically populated list of subjects -->
            </ul>
        </section>
    </main>
    <nav>
        %[admin_nav]
    </nav>
</section>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetchJson('/subjects').then(data => {
                const subjectList = document.getElementById('subjectList');
                data.forEach(subject => {
                    const li = document.createElement('li');
                    li.textContent = subject.name;
                    li.style.cursor = 'pointer';
                    li.title = 'Bearbeiten';
                    li.addEventListener('click', (e) => viewSubject(subject));
                    subjectList.appendChild(li);
                });
            })
            .catch(error => console.error('Error fetching subjects:', error));
        fetch('/curriculum-enrollment-catalog',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(r=>r.json()).then(data=>{
            const box=document.getElementById('subjectTypes');box.innerHTML='<h3>Fachart</h3>';
            data.subjects.forEach(s=>{const row=document.createElement('p');row.textContent=s.name+' ';const select=document.createElement('select');[
                ['REGULAR:','Verbindlich für alle'],
                ['INDIVIDUAL:WPF','Individuell: WPF'],
                ['INDIVIDUAL:RELIGION_ETHIK','Individuell: Religion / Ethik']
            ].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;select.append(o)});
            select.value=(s.mode==='INDIVIDUAL'?'INDIVIDUAL:'+(s.assignmentGroup||'WPF'):'REGULAR:');
            const b=document.createElement('button');b.type='button';b.textContent='Speichern';
            b.onclick=async()=>{const [mode,assignmentGroup]=select.value.split(':');const response=await fetch('/set-curriculum-subject-type',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjectId:s.id,mode,assignmentGroup:assignmentGroup||null})});b.textContent=response.ok?'Gespeichert':'Fehler';};
            row.append(select,b);box.append(row)});
        }).catch(()=>{});
    });
</script>
