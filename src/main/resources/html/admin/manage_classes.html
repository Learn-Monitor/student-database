%[site;title=Klassen verwalten;content=!FOLLOWS]
<section id="classes" class="admin-shell admin-list-page">
    <header class="admin-page-header">
        <p class="admin-eyebrow">Admin · Schuldaten</p>
        <h1>Klassen verwalten</h1>
        <p class="admin-page-intro">Klassen und Jahrgänge pflegen. Schüler-Stammklassen werden hier nicht automatisch verändert.</p>
    </header>
    %[admin_nav]
    <main>
        <section id="addClass" class="admin-panel">
            <h2>Klasse hinzufügen</h2>
            <form id="addClassForm" class="admin-form" method="post" action="/add-class">
                <div class="admin-form-field"><label for="className">Name der Klasse</label><input type="text" id="className" name="className" required></div>
                <div class="admin-form-field"><label for="grade">Jahrgang</label><input type="number" id="grade" name="grade" required></div>
                <button type="submit">Hinzufügen</button>
            </form>
        </section>
        <section id="classList" class="admin-panel">
            <h2>Klassenübersicht</h2>
            <p id="class-list-status" class="admin-inline-status" role="status" aria-live="polite"></p>
            <div class="admin-table-scroll"><table id="classTable" class="admin-data-table">
                <caption class="admin-visually-hidden">Klassenübersicht</caption>
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Jahrgang</th>
                        <th scope="col">Aktionen</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- class rows will be inserted here -->
                </tbody>
            </table></div>
        </section>
    </main>
</section>
<script src="/manage-classes.js" defer></script>
<script src="/admin-section-navigation.js" defer></script>
