%[student_dashboard;script=build_student.js;nav=!FOLLOWS]
%[admin_student_nav]
<section id="admin-student-profile"><h2>Schüler bearbeiten</h2>
<form method="post" action="/edit-student-profile" onsubmit="return confirm('Änderungen an diesem Schüler speichern?')">
<input type="hidden" name="id" id="adminStudentId"><label>Vorname <input name="firstName" id="adminStudentFirst" required></label><label>Nachname <input name="lastName" id="adminStudentLast" required></label><label>Loginname <input name="email" id="adminStudentEmail" type="text" required></label><label>Passwort <input name="password" id="adminStudentPassword" type="password"></label><label>Klasse <select name="classId" id="adminStudentClass" required></select></label><label>Abschlussstufe <select name="graduationLevel" id="adminStudentLevel"></select><button>Stammdaten speichern</button>
</form></section>
<script>
document.addEventListener('DOMContentLoaded',async()=>{const s=JSON.parse(sessionStorage.getItem('currentStudent')||'null');if(!s)return;adminStudentId.value=s.id;adminStudentFirst.value=s.firstName||'';adminStudentLast.value=s.lastName||'';adminStudentEmail.value=s.email||'';for(let i=0;i<graduationLevels.length;i++){const o=new Option(graduationLevels[i],i);if(i==s.graduationLevel)o.selected=true;adminStudentLevel.add(o)};for(const c of [{id:0,label:'Nicht zugeordnet'},...await fetchClasses()]){const o=new Option(c.label,c.id);if(c.id==s.classId||c.id==s.class?.id)o.selected=true;adminStudentClass.add(o)}});
</script>
