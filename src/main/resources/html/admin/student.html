<section id="admin-student-profile" class="admin-shell admin-detail-page">
    <header class="admin-page-header">
        <p class="admin-eyebrow">Admin · Schuldaten · Schüler</p>
        <h1>Schüler bearbeiten</h1>
        <p class="admin-page-intro">Stammdaten, Klasse und Abschlussstufe verwalten.</p>
    </header>
    %[admin_nav]
    <nav class="admin-detail-nav" aria-label="Schülerverwaltung">
        <a href="/manage_students">← Schülerverwaltung</a>
        <a href="/dashboard#schuldaten">Schuldaten</a>
    </nav>
    <p id="adminStudentMessage" class="admin-inline-status" role="status" aria-live="polite" hidden></p>
    <p id="adminStudentBackLink" class="admin-inline-status" hidden><a href="/manage_students">Zurück zur Schülerverwaltung</a></p>
    <form id="adminStudentForm" class="admin-panel admin-form" method="post" action="/edit-student-profile">
        <input type="hidden" name="id" id="adminStudentId">
        <div class="admin-form-field"><label for="adminStudentFirst">Vorname</label><input name="firstName" id="adminStudentFirst" required></div>
        <div class="admin-form-field"><label for="adminStudentLast">Nachname</label><input name="lastName" id="adminStudentLast" required></div>
        <div class="admin-form-field"><label for="adminStudentEmail">Loginname</label><input name="email" id="adminStudentEmail" type="text" required></div>
        <div class="admin-form-field"><label for="adminStudentPassword">Neues Passwort (optional)</label><input name="password" id="adminStudentPassword" type="password"></div>
        <div class="admin-form-field"><label for="adminStudentClass">Klasse</label><select name="classId" id="adminStudentClass" required></select></div>
        <div class="admin-form-field"><label for="adminStudentLevel">Abschlussstufe</label><select name="graduationLevel" id="adminStudentLevel"></select></div>
        <button type="submit">Stammdaten speichern</button>
    </form>
</section>
<script src="/admin-student-profile.js" defer></script>
