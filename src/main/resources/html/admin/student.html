%[student_dashboard;script=build_student.js;nav=!FOLLOWS]
%[admin_student_nav]
<section id="admin-student-profile">
    <h2>Schüler bearbeiten</h2>
    <p id="adminStudentMessage" hidden></p>
    <p id="adminStudentBackLink" hidden><a href="/manage_students">Zurück zur Schülerverwaltung</a></p>
    <form id="adminStudentForm" method="post" action="/edit-student-profile">
        <input type="hidden" name="id" id="adminStudentId">
        <label for="adminStudentFirst">Vorname</label>
        <input name="firstName" id="adminStudentFirst" required>
        <label for="adminStudentLast">Nachname</label>
        <input name="lastName" id="adminStudentLast" required>
        <label for="adminStudentEmail">Loginname</label>
        <input name="email" id="adminStudentEmail" type="text" required>
        <label for="adminStudentPassword">Neues Passwort (optional)</label>
        <input name="password" id="adminStudentPassword" type="password">
        <label for="adminStudentClass">Klasse</label>
        <select name="classId" id="adminStudentClass" required></select>
        <label for="adminStudentLevel">Abschlussstufe</label>
        <select name="graduationLevel" id="adminStudentLevel"></select>
        <button type="submit">Stammdaten speichern</button>
    </form>
</section>
<script src="/admin-student-profile.js" defer></script>
