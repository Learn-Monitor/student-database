%[site;title=Fach verwalten;content=!FOLLOWS]
<script src="build_subject.js" ></script>
<section id="dashboard">
    <header>
        <h1>Fach bearbeiten</h1>
    </header>
    <section id="editData">
        <h2>Daten bearbeiten</h2>
        <form id="editSubjectForm" method="post" action="/edit-subject">
            <input type="hidden" class="subjectId" name="id">
            <label for="subjectNameField">Name des Fachs:</label>
            <input type="text" id="subjectNameField" name="name">
            <button type="submit">Speichern</button>
        </form>
        <p>Zentrale Themen, Etappen und Münzwerte werden semesterbezogen im zentralen Curriculum verwaltet.</p>
        <p><a href="/dashboard#curriculum">Zentrales Curriculum verwalten</a></p>
    </section>
    <section id="deleteSubject">
        <h2>Fach löschen</h2>
        <button id="deleteSubjectButton">Fach löschen</button>
    </section>
    <nav>
        %[admin_subject_nav]
    </nav>
</section>
